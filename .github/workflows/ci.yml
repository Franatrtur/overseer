name: CI Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (GDB & GCC)
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb gcc

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Compile test binaries
        run: |
          cd tests/test_programs
          gcc -O0 -g consecutive_dup.c -o consecutive_dup
          gcc -O0 -g failing_dup.c -o failing_dup
          gcc -O0 -g windowed_dup.c -o windowed_dup
          gcc -O0 -g ttyname_dup.c -o ttyname_dup
          gcc -O0 -g stateful_io.c -o stateful_io
          gcc -O0 -g suspicious_mmap.c -o suspicious_mmap
          gcc -O0 -g antidebug_ptrace.c -o antidebug_ptrace

      - name: Run all unit and integration tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
